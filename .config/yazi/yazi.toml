#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [0, 4, 3]
linemode = "size"

[preview]
max_width = 4000
max_height = 3000

[tasks]
suppress_preload = true

[plugin]
prepend_fetchers = [
  { group = "mime", url = "*", run = "mime-ext", if = "!(mime|dummy)", prio = "high" },
]
prepend_previewers = [
  { mime = "{audio,video}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "code" },
]
