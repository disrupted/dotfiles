# Tinycast: installed straight from the GitHub release zip via the `http`
# backend + a postinstall hook (no Homebrew cask, no Ruby). The hook copies
# Tinycast.app into /Applications and strips quarantine.
[tools."http:tinycast"]
version = "latest"
url = "https://github.com/abue-ammar/tinycast/releases/download/v{{ version }}/Tinycast-Universal-{{ version }}.zip"
format = "zip"
strip_components = 0
version_list_url = "https://api.github.com/repos/abue-ammar/tinycast/releases/latest"
version_json_path = ".tag_name"
postinstall = { run = "$HOME/.config/mise/scripts/install-tinycast.sh", when = "always" }

[settings]
self_update.auto = true
experimental = true
trusted_config_paths = ["~/bakdata", "~/bayer", "~/spectrumk"]

[settings.python]
compile = false
uv_venv_auto = true

[settings.rust]
rustup_home = "~/.local/share/mise/rustup"
cargo_home = "~/.local/share/mise/cargo"

[tasks."docker:stop-all"]
description = "Docker stop all containers"
run = """
if [ -z "$(docker ps -q)" ]; then
  echo "No running containers"
else
  echo "Stopping all running containers..."
  docker stop $(docker ps -a -q) || true
fi
"""

[tasks."docker:prune"]
description = "Docker prune"
depends = ["docker:stop-all"]
run = """
docker system prune -f
docker image prune -a -f
docker builder prune -a -f
docker buildx prune -a -f
"""

[bootstrap.packages]
# nushell stays on the brew backend (not native)
# nushell is the login shell and needs a stable real binary at /opt/homebrew/bin/nu.
# a versioned path from the native backend breaks on upgrade.
# mise shims reject the `-nu` argv0 that login(1) uses.
"brew:nushell" = "latest"
"brew:wget" = "latest"
"brew:pv" = "latest"
