claude = "latest"
worktrunk = { version = "latest", workflow = "release.yaml" }
"github:JohnnyMorganz/luau-lsp" = "1.70.1"

[settings]
self_update.auto = true
experimental = true

# dotfiles are versioned in ~/.dotfiles (git), not mise's own history/capture
[settings.history]
enabled = false

[settings.python]
compile = false
uv_venv_auto = true

[settings.rust]
rustup_home = "~/.local/share/mise/rustup"
cargo_home = "~/.local/share/mise/cargo"

[tasks."docker:stop-all"]
description = "Docker stop all containers"
run = """
if [ -z "$(docker ps -q)" ]; then
  echo "No running containers"
else
  echo "Stopping all running containers..."
  docker stop $(docker ps -a -q) || true
fi
"""

[tasks."docker:prune"]
description = "Docker prune"
depends = ["docker:stop-all"]
run = """
docker system prune -f
docker image prune -a -f
docker builder prune -a -f
docker buildx prune -a -f
"""

[env]
PI_CODING_AGENT_DIR = "{{ env.HOME }}/.config/pi"

# ~/.dotfiles mirrors $HOME; committed files are symlinked into place.
# OS-specific files: os/<os>/ (config.<os>.toml). Work files: config.work.toml.
[dotfile_groups.home]
root = "."
target = "~"
manifest = "git"
exclude = ["/README.md", "/AGENTS.md", "/.gitignore", "/.config/_screens", "/os", ".DS_Store"]

# link whole dir: new files land in the repo; pickers skip per-file symlinks
[dotfile_groups.home.entries]
"~/.config/nvim" = { mode = "symlink" }

[bootstrap.repos]
"~/.config/rex/rex-worktrunk" = { url = "https://github.com/disrupted/rex-worktrunk.git", ref = "label-option" }
