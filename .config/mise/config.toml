"pypi:debugpy" = "latest"
"npm:@astrojs/language-server" = { version = "latest", postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:vscode-langservers-extracted" = { version = "latest", postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:@microsoft/compose-language-service" = { version = "latest", postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:@actions/languageserver" = { version = "latest", postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:@fsouza/prettierd" = { version = "latest", postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:svelte-language-server" = { version = "latest", trust_policy_excludes = [
  "svelte@4.2.20",
], postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:@tailwindcss/language-server" = { version = "latest", postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:yaml-language-server" = { version = "latest", postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:@mistweaverco/kulala-fmt" = { version = "latest", allow_low_downloads = true, postinstall = { run = "$HOME/.config/mise/scripts/overwrite-node-with-bun-runtime.sh", when = "always" } }
"npm:typescript-svelte-plugin" = "latest"  # library plugin, no bin/ -> no runtime to patch
"aqua:ewhauser/shuck" = "latest"
worktrunk = { version = "latest", workflow = "release.yaml" }
"github:JohnnyMorganz/luau-lsp" = "1.70.1"

[tools."http:boxd"]
version = "latest"
bin = "boxd"
# boxd only publishes the latest build, at an unversioned URL
url = "https://boxd.sh/downloads/cli/boxd-{{ os(macos='darwin') }}-{{ arch(x64='amd64') }}"
version_list_url = "https://boxd.sh/downloads/cli/latest-linux-amd64.json"
version_json_path = ".version"
checksum_url = "https://boxd.sh/downloads/cli/latest-{{ os(macos='darwin') }}-{{ arch(x64='amd64') }}.json"
checksum_expr = '"sha256:" + fromJSON(body).sha256'

[settings]
experimental = true
task.run_auto_install = false
exec_auto_install = true
# experimental and slows down `mise search`; opt in per project
disable_backends = ["truebrew"]

# dotfiles are versioned in ~/.dotfiles (git), not mise's own history/capture
[settings.history]
enabled = false

[settings.python]
compile = false
uv_venv_auto = true

[settings.rust]
rustup_home = "~/.local/share/mise/rustup"
cargo_home = "~/.local/share/mise/cargo"

[settings.github]
credential_command = 'fnox -c "$HOME/fnox.toml" get GITHUB_TOKEN'

# a preset token (nono's phantom for agents) wins over the PAT
[wrappers.gh]
command = "sh"
args = [
  "-c",
  '[ -n "${GH_TOKEN:-}${GITHUB_TOKEN:-}" ] && exec gh "$@"; exec fnox -c "$HOME/fnox.toml" exec --only GITHUB_TOKEN -- gh "$@"',
  "gh",
]

[tasks."docker:stop-all"]
description = "Docker stop all containers"
run = """
if [ -z "$(docker ps -q)" ]; then
  echo "No running containers"
else
  echo "Stopping all running containers..."
  docker stop $(docker ps -a -q) || true
fi
"""

[tasks."docker:prune"]
description = "Docker prune"
depends = ["docker:stop-all"]
run = """
docker system prune -f
docker image prune -a -f
docker builder prune -a -f
docker buildx prune -a -f
"""

[tasks."agent:prune"]
description = "Prune tools installed by sandboxed agents"
run = "rm -rf ~/.local/share/mise-agent ~/.cache/mise-agent"

[tasks."agent:smoke-test"]
description = "Run agent workflows in the nono sandbox to catch regressions after updates"
usage = '''
flag "--network" help="Also check the credential proxy (gh, git over HTTPS)"
arg "[agent]..." help="Agents to test, default all launchers"
'''
run = "~/.config/nono/bin/smoke-test.sh ${usage_network:+--network} ${usage_agent:-}"

[env]
PI_CODING_AGENT_DIR = "{{ env.HOME }}/.config/pi"

# ~/.dotfiles mirrors $HOME; committed files are symlinked into place.
# OS-specific files: os/<os>/ (config.<os>.toml). Work files: config.work.toml.
[dotfile_groups.home]
root = "."
target = "~"
manifest = "git"
exclude = [
  "/README.md",
  "/AGENTS.md",
  "/.gitignore",
  "/.config/_screens",
  "/os",
  ".DS_Store",
]

# link whole dir: new files land in the repo; pickers skip per-file symlinks
[dotfile_groups.home.entries]
"~/.config/nvim" = { mode = "symlink" }
# boxd and OrbStack write to ~/.ssh/config, so it stays local
"~/.ssh/config/dotfiles" = { line = "Include ~/.ssh/config.d/dotfiles", position = "prepend" }

[dotfile_groups.private]
root = "~/.dotfiles-private/home"
target = "~"
manifest = "git"

[dotfile_groups.private.entries]
"~/.config/maki/AGENTS.md" = { source = ".config/agents/AGENTS.md" }
"~/.config/pi/AGENTS.md" = { source = ".config/agents/AGENTS.md" }

[bootstrap.repos]
"~/.dotfiles-private" = { url = "https://github.com/disrupted/dotfiles-private.git" }
