expert = "latest"
helm-ls = "latest"
terraform-ls = "latest"
tombi = "latest"
"github:ribru17/ts_query_ls" = "latest"
"github:vale-cli/vale-ls" = "latest"
"github:stubbedev/shell-lsp" = "latest"
"cargo:emmylua_check" = "0.25.1"
"cargo:emmylua_formatter" = "0.25.1"
"cargo:emmylua_ls" = "0.25.1"
"cargo:gitlab-ci-ls" = "latest"
