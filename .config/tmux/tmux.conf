set -g prefix C-z
unbind-key C-b

# Keep Ctrl+Z as tmux prefix, but disable prefix+Ctrl+Z passthrough.
unbind-key -T prefix C-z
bind-key -T prefix C-z display-message "prefix C-z passthrough disabled"

set -g default-terminal 'tmux-256color'

# symlink Homebrew ncurses copy into ~/.terminfo
# macOS ships an ancient ncurses terminfo for tmux-256color that lacks Smulx (undercurl) capability
if-shell 'test -f /opt/homebrew/opt/ncurses/share/terminfo/74/tmux-256color && [ ! -L ~/.terminfo/74/tmux-256color ]' \
    'run "mkdir -p ~/.terminfo/74 && ln -sf /opt/homebrew/opt/ncurses/share/terminfo/74/tmux-256color ~/.terminfo/74/tmux-256color"'

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# tell tmux that the outer terminal supports styled underscores and underline colour
set -as terminal-features ',*:usstyle'
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set -g base-index 1
setw -g pane-base-index 1

# Automatically set window title
set-hook -g after-split-window 'selectp -T ""'
set-hook -g after-new-window 'selectp -T ""'
set-hook -g after-new-session 'selectp -T ""'
set -g status-interval 5
set -g automatic-rename off
set -g automatic-rename-format '#{b:pane_current_path}'
# set -g automatic-rename-format '{?pane_title,#{pane_title},#{b:pane_current_path}}'

# set name for terminal emulator
set -g set-titles on
set -g set-titles-string "#S:#I #W - #T"
set -g window-size latest
set-window-option -g aggressive-resize

set -g word-separators " -_()@,[]{}:=/"

# Renumber windows when one is closed
set -g renumber-windows on
set -g detach-on-destroy off

set -g visual-activity off
# setw -g monitor-activity on

set -g monitor-bell on      # highlight the window in the status line
set -g bell-action none     # no alert action: no "Bell in window N" message and no sound

# open window with current path at next index directly right from current window
bind c new-window -c '#{pane_current_path}' -a
# open window with current path at end
bind C new-window -c '#{pane_current_path}'
bind S display-popup -E "nu --login --interactive $HOME/.local/bin/tmux-session-pick"
bind s choose-tree -sZ -O name

# pane splits with current path (from tmux-pain-control)
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"

# No delay for escape key press
set -sg escape-time 0

set -g focus-events on

# History limit
set -g history-limit 50000

# Mouse
set -g mouse on
# set -g mouse-select-window on
# set -g mouse-select-pane on
# set -g mouse-resize-pane on

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; \
    run-shell -b '~/.config/tmux/scratch-popup.sh --prune' \; \
    display-message "tmux.conf reloaded"

# order sessions by name, not by index (restore old behavior)
# bind s choose-tree -sZ -O name

### PLUGINS
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# free up C-\ (default "previous pane") for the popup scratch shell
set -g @vim_navigator_mapping_prev 'null'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @net_speed_format "D %s U %s"
# disable because it causes issues in latest tmux and lacks compatibility with nushell
# https://github.com/fcsonline/tmux-thumbs/issues/153
# set -g @plugin 'fcsonline/tmux-thumbs'  # fast copy pasting inside tmux: prefix + space
# set -g @thumbs-command 'echo -n {} | pbcopy && tmux display-message "Copied {}"'
# set -g @thumbs-reverse enabled # get shorter hints closer to the cursor
# set -g @thumbs-regexp-1 '[a-z0-9-]+'  # match docker tags
set -g @plugin 'wfxr/tmux-fzf-url'

# THEME
source-file ~/.config/tmux/themes/disrupted-universal.conf

set -g clock-mode-style 24
set -g status-position bottom

set -g mode-keys vi
set -g status-keys vi

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# KEYBINDINGS
# zoom
bind-key -n M-z resize-pane -Z

# session switching
bind-key -n M-j switch-client -n
bind-key -n M-k switch-client -p

# persistent scratch terminal popup: one per tmux window, keyed by #{window_id}
# The popup hosts a nested client attached to a "scratch-@N" session, so state survives closing the popup
# Orphaned scratch sessions are pruned on config reload (prefix + r).
bind-key -n C-\\ if-shell -F '#{m/r:^scratch-,#{session_name}}' \
    'detach-client' \
    'display-popup -E -w 90% -h 85% -d "#{pane_current_path}" -T " scratch " ~/.config/tmux/scratch-popup.sh'

# easily re-order windows
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# interactively move pane to other session / window
bind-key m choose-tree -Zs "join-pane -t '%%'"
bind-key C-m choose-tree -Zw "join-pane -t '%%'"

# interactively move window to other session
bind-key M choose-tree -Zs "move-window -t '%%'"

# swap panes (because I tend to forget)
# <prefix> + { or }

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell "test -f ~/.config/tmux/plugins/tpm/tpm" \
    "run -b '~/.config/tmux/plugins/tpm/tpm'"
