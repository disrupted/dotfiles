[tools]
# until ntf publishes releases install its source archive directly
# fork of notomo/ntf for --json support neotest-ntf needs
"http:ntf" = { version = "feat-json-output", url = "https://github.com/disrupted/ntf/archive/refs/heads/feat/json-output.tar.gz", bin = "bin/ntf" }

[tasks.check]
description = "Run Emmylua type checks"
run = "nvim -l scripts/emmylua.lua && VIMRUNTIME='/Users/disrupted/.local/share/mise/installs/neovim/nightly/share/nvim/runtime' emmylua_check . --warnings-as-errors"

[tasks.test]
description = "Run the test suite"
run = "ntf --process-hook=./tests/minimal_init.lua ./tests"
